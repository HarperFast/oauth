name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/pr-checks.yml
    permissions:
      contents: read

  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: [checks, integration-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write # version commit, tag and GitHub Release
      issues: write # release comments on issues
      pull-requests: write # release comments on PRs
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # Keeps the token away from dependency install scripts; semantic-release
          # pushes with the GITHUB_TOKEN passed to its own step.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm's trusted publisher for this package names this file and the Release
      # environment; renaming either breaks publishing.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
