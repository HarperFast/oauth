name: Gemini PR Review

# Thin caller of the Gemini reusable in HarperFast/ai-review-prompts.
# Runs in parallel with claude-review.yml so the two reviewers can be
# compared on the same PRs.
#
# Layer inputs and `repo-specific-checks:` MIRROR claude-review.yml
# in this repo. Output comparability between the two providers
# depends on them seeing the same review scope — keep them in sync
# when bumping the pin or editing the checks block.
#
# Pre-requisites:
#   - HARPERFAST_AI_CLIENT_ID       (org-level App Client ID)
#   - HARPERFAST_AI_APP_PRIVATE_KEY (org-level App private key)
#   - GEMINI_API_KEY                (per-repo; optional — missing
#                                   key cleanly skips the review
#                                   with a workflow notice)
#   - AI_REVIEW_LOG_TOKEN           (optional — threads each run
#                                   into a per-(PR, provider) issue
#                                   in HarperFast/ai-review-log
#                                   with `provider:gemini` label)

on:
  pull_request:
    # `labeled` admits the `gemini-review` opt-in gesture. `vars.*`
    # can't be read in `on:` (only in a job `if:`), so the trigger
    # lists the union and the `review` job gates on GEMINI_ALWAYS_ON.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# No concurrency block: cancellation is owned by the reusable's review
# job (job-level group, engaged only after authorization), so an
# unauthorized or skipped event can never cancel a legitimate review.

jobs:
  review:
    # Always-on toggle — see ai-review-prompts USAGE.md "Reviewers & the
    # always-on toggle". This repo sets GEMINI_ALWAYS_ON=true to keep the
    # Gemini calibration baseline running on every PR; unset → opt-in via
    # the gemini-review label. The reusable's authorize job still owns
    # WHO is admitted (CODEOWNERS trust set; the labeler on `labeled`).
    # Note: the `gemini-review` label name is deliberately duplicated —
    # the caller gate names it (below) AND the reusable's authorize
    # matches it; renaming the label means changing both.
    if: ${{ (github.event.action == 'labeled' && github.event.label.name == 'gemini-review') || (github.event.action != 'labeled' && vars.GEMINI_ALWAYS_ON == 'true') || (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'gemini-review')) }}
    uses: HarperFast/ai-review-prompts/.github/workflows/_gemini-review.yml@af81872e56dd63da1160adb5eae82d359a456dde # main 2026-09-01 (#94 freshness-gated admission; #91 job-level cancellation; #90 cost gates; #89 defaults; #88 lenses)
    # Caller-side permissions, scoped at the calling-job level (NOT
    # workflow-level — that placement caps the reusable's per-job
    # grants below what they need and breaks the workflow at startup;
    # see ai-review-prompts#39/#40 for the incident). Union of what
    # the reusable's `authorize` (`contents: read`) and `review`
    # (`contents: read + pull-requests: write + id-token: write`)
    # jobs declare. GitHub's rule: caller's GITHUB_TOKEN permissions
    # can only be DOWNGRADED (not elevated) by the called workflow,
    # so the caller must grant at least the union the reusable needs.
    # Mirrors claude-review.yml in this repo — surfaced as a finding
    # by Gemini's own review on PR #88.
    # Reference: https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      # Same SHA as the `uses:` ref above. See claude-review.yml
      # in this repo for why the duplication is unavoidable
      # (reusable workflows can't introspect their own ref in
      # workflow_call context).
      ai-review-prompts-ref: af81872e56dd63da1160adb5eae82d359a456dde
      review-layers: |
        universal
        harper/common
        harper/v5
        repo-type/plugin
      repo-specific-checks: |
        ## Repo-specific checks (OAuth plugin)

        On top of the layered scope above, these are OAuth-only
        semantics not covered by the shared layers:

        - CSRF state tokens present on every OAuth flow; 10-minute
          expiry is enforced; state is single-use
        - Redirect URI validation on callback endpoints
        - Provider-of-record enforcement (cross-provider CSRF
          protection should redirect with error, not 403)
        - Session field preservation across token refresh
          (`provider`, `providerConfigId`, `providerType`)
        - Path length validation (≤ 2048 chars) where user input
          can reach a path
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_REVIEW_LOG_TOKEN: ${{ secrets.AI_REVIEW_LOG_TOKEN }}
      HARPERFAST_AI_CLIENT_ID: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
      HARPERFAST_AI_APP_PRIVATE_KEY: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}
