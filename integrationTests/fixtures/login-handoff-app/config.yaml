# Integration-test fixture for the sign-in handoff (postLoginRedirectOrigins,
# central-manager#911). A generic provider backed by a Node-owned stub IdP; the
# allowlist names a preview-style wildcard. debug is on (loopback-only debug
# routes) so the test can read /oauth/stub/user back through a handed-off session.
rest: true

'@harperfast/oauth':
  package: '@harperfast/oauth'
  debug: true
  redirectUri: 'http://localhost:9926/oauth' # integration-test loopback — opted in explicitly, no default
  postLoginRedirectOrigins: ${HANDOFF_ORIGINS}
  providers:
    stub:
      provider: generic
      clientId: stub-client-id
      clientSecret: stub-client-secret
      authorizationUrl: ${STUB_IDP_AUTHORIZE_URL}
      tokenUrl: ${STUB_IDP_TOKEN_URL}
      userInfoUrl: ${STUB_IDP_USERINFO_URL}
