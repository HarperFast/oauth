# Integration-test fixture for the account-adoption gate's operator escape
# hatch (#230): allowUnverifiedClaimInheritance restores pre-2.6 behavior,
# letting an unverified claim adopt an existing account. No JWKS/issuer
# configured — the stub IdP never issues an id_token here, so every login is
# on the unauthenticated-claim path the gate normally denies.
rest: true

'@harperfast/oauth':
  package: '@harperfast/oauth'
  redirectUri: 'http://localhost:9926/oauth' # integration-test loopback — opted in explicitly, no default
  allowUnverifiedClaimInheritance: true
  providers:
    stub:
      provider: generic
      clientId: stub-client-id
      clientSecret: stub-client-secret
      authorizationUrl: ${STUB_IDP_AUTHORIZE_URL}
      tokenUrl: ${STUB_IDP_TOKEN_URL}
      userInfoUrl: ${STUB_IDP_USERINFO_URL}
