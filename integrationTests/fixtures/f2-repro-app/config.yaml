# Integration-test fixture for F2 reproduction: OAuth username collision.
#
# Configures a generic OAuth provider backed by a Node-owned stub IdP whose
# userinfo endpoint returns whatever email the test sets. No MCP, no custom JS
# app — the test drives the human login flow and asserts via the operations API.
rest: true

'@harperfast/oauth':
  package: '@harperfast/oauth'
  providers:
    stub:
      provider: generic
      clientId: stub-client-id
      clientSecret: stub-client-secret
      authorizationUrl: ${STUB_IDP_AUTHORIZE_URL}
      tokenUrl: ${STUB_IDP_TOKEN_URL}
      userInfoUrl: ${STUB_IDP_USERINFO_URL}
